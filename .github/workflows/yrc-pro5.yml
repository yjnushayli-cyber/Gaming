name: YRC Pro 5 Independent APK
on:
  push:
    branches: [main]
    paths:
      - 'session5/**'
      - 'settings.gradle'
      - 'build.gradle'
      - '.github/workflows/yrc-pro5.yml'
  workflow_dispatch:
jobs:
  build-session5:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Android SDK platform
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
      - name: Build independent YRC Pro 5
        run: gradle --no-daemon --stacktrace :session5:assembleDebug
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: YRC-Pro-5-Independent-APK
          path: session5/build/outputs/apk/debug/*.apk
          if-no-files-found: error
